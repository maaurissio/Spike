<div id="vt-terminal" data-theme="system" aria-label="Maqueta de VTracker: interfaz de terminal con datos ficticios">
<style>
  #vt-terminal{color-scheme:light dark;--term-bg:light-dark(#f5f7fa,#0f1621);--term-fg:light-dark(#203449,#dce6ef);--term-dim:light-dark(#526579,#96a8bc);--term-border:light-dark(#8091a5,#50627a);--term-cyan:light-dark(#006578,#72d8f2);--term-green:light-dark(#156848,#84d7a4);--term-red:light-dark(#a32f4a,#ff91a7);--term-purple:light-dark(#7043a1,#c6a5f5);--term-amber:light-dark(#825708,#ecc681);--term-selection:light-dark(#dbeaf2,#20354b);--term-tab-bg:light-dark(#006578,#72d8f2);--term-tab-fg:light-dark(#ffffff,#0f1621);background:var(--term-bg);color:var(--term-fg);padding:8px;container-type:inline-size}
  #vt-terminal[data-theme="dark"]{color-scheme:dark}
  #vt-terminal[data-theme="light"]{color-scheme:light}
  #vt-terminal[data-theme="mono"]{--term-bg:light-dark(#f7f7f7,#171717);--term-fg:light-dark(#252525,#e5e5e5);--term-dim:light-dark(#595959,#aaaaaa);--term-border:light-dark(#808080,#777777);--term-selection:light-dark(#dddddd,#333333);--term-cyan:var(--term-fg);--term-green:var(--term-fg);--term-red:var(--term-fg);--term-purple:var(--term-fg);--term-amber:var(--term-fg);--term-tab-bg:var(--term-fg);--term-tab-fg:var(--term-bg)}
  #vt-terminal *{box-sizing:border-box}
  #vt-terminal .term-screen{font:13px/1.3 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-variant-ligatures:none;letter-spacing:0;white-space:pre;margin:0;padding:0;background:transparent;border:0;border-radius:0;color:var(--term-fg);overflow:visible}
  #vt-terminal button{font:inherit;line-height:inherit;letter-spacing:inherit;color:inherit;background:transparent;border:0;border-radius:0;padding:0;margin:0;white-space:pre;cursor:pointer;vertical-align:baseline}
  #vt-terminal button:focus-visible{outline:1px solid var(--term-cyan);outline-offset:0}
  #vt-terminal button:not(:disabled):hover,#vt-terminal .term-selected{background:var(--term-selection)}
  #vt-terminal button:disabled{color:var(--term-dim);cursor:not-allowed}
  #vt-terminal .term-tab-active{background:var(--term-tab-bg);color:var(--term-tab-fg)}
  #vt-terminal .term-dim{color:var(--term-dim)}
  #vt-terminal .term-border{color:var(--term-border)}
  #vt-terminal .term-cyan{color:var(--term-cyan)}
  #vt-terminal .term-green{color:var(--term-green)}
  #vt-terminal .term-red{color:var(--term-red)}
  #vt-terminal .term-purple{color:var(--term-purple)}
  #vt-terminal .term-amber{color:var(--term-amber)}
  #vt-terminal .term-small{display:none}
  @container(max-width:575px){#vt-terminal .term-large{display:none}#vt-terminal .term-small{display:block}}
</style>
<div class="term-content" aria-live="polite"></div>
<script>
(()=>{
  const root=document.getElementById('vt-terminal');
  const content=root.querySelector('.term-content');
  // Fixture de diseño: ninguna consulta de red, identidad real o credencial.
  const players=[
    ['Norte','Sova','DIA 2','1.18','55%','VVDVV','26%','152'],
    ['Bruma','Omen','DIA 1','1.06','50%','DVDVV','22%','138'],
    ['Prisma','Jett','ASC 1','1.31','60%','VVVDV','31%','167'],
    ['Cobre','Killjoy','DIA 2','0.98','50%','VDDVD','24%','126'],
    ['Luna','Sage','PLA 3','1.02','55%','DVVDV','21%','132'],
    ['Eco','Raze','DIA 3','1.22','55%','VVDDV','27%','160'],
    ['Oculto','Cypher','—','—','—','—','—','—'],
    ['Sur','Breach','DIA 1','1.09','50%','DVVDV','23%','142'],
    ['Marea','Omen','DIA 2','1.14','55%','VDVDV','25%','148'],
    ['Ámbar','Sova','PLA 3','0.96','50%','DDVVD','20%','129']
  ];
  const rounds=[{k:1,d:1},{k:0,d:1},{k:2,d:0},{k:1,d:1},{k:4,d:0},{k:0,d:1}];
  const roundTotals=rounds.reduce((total,r)=>({k:total.k+r.k,d:total.d+r.d}),{k:0,d:0});
  const history=[
    {map:'Ascent',agent:'Sova',score:'13:9',win:true,k:27,d:15,a:8,rr:19,acs:264},
    {map:'Haven',agent:'Omen',score:'8:13',win:false,k:14,d:18,a:6,rr:-16,acs:186},
    {map:'Bind',agent:'Sova',score:'13:11',win:true,k:18,d:19,a:10,rr:17,acs:209}
  ];
  const tabs=['Panel','Partida','Perfil','Historial','Ajustes'];
  const themes=[['system','Sistema'],['dark','Noche'],['light','Claro'],['mono','Sin color']];
  let view=1,selected=0,historyIndex=0,detail=false,trackerPreview=false,post=false,interval=3,logs=false,theme=0;
  const plain=markup=>markup.replace(/<[^>]*>/g,'');
  const pad=(value,size)=>String(value).slice(0,size).padEnd(size,' ');
  const paint=(text,kind)=>`<span class="term-${kind}">${text}</span>`;
  const key=text=>paint(text,'cyan');
  const button=(text,action,style='',label='')=>`<button type="button" data-action="${action}"${style?` class="term-${style}"`:''}${label?` aria-label="${label}"`:''}>${text}</button>`;
  const unavailableTracker=()=>'<button type="button" disabled aria-label="Abrir Tracker.gg, no disponible en la maqueta">[Abrir Tracker.gg]</button>';
  const form=value=>value==='—'?paint('—','amber'):value.split('').map(v=>paint(v,v==='V'?'green':'red')).join('');
  const rank=value=>paint(value,value.trim()==='—'?'amber':value.startsWith('DIA')?'purple':value.startsWith('ASC')?'green':'cyan');
  const rr=value=>paint((value>0?'+':'')+value,value>0?'green':'red');
  function screen(width){
    const narrow=width===38,inner=width-2,lines=[];
    function row(markup=''){
      const count=plain(markup).length;
      if(count>inner)throw new Error(`Fila excede ${width} columnas: ${plain(markup)}`);
      lines.push(paint('│','border')+markup+' '.repeat(inner-count)+paint('│','border'));
    }
    function section(title,kind='cyan',suffix='',first=false){
      const room=inner-title.length-suffix.length-5;
      if(room<0)throw new Error('Cabecera demasiado ancha');
      lines.push(paint(first?'╭─ ':'├─ ','border')+paint(title,kind)+paint(' '+'─'.repeat(room)+' ','border')+paint(suffix,'dim')+paint(first?'─╮':'─┤','border'));
    }
    function edge(left,right){lines.push(paint(left+'─'.repeat(inner)+right,'border'))}
    function pair(left,right){return left+' '.repeat(Math.max(1,inner-2-plain(left).length-plain(right).length))+right}
    section('VTRACKER','cyan',narrow?'DEMO':'TUI / DEMO · SIN CONEXIÓN',true);
    const tab=(t,i)=>button(` ${i+1} ${t} `,`tab:${i}`,view===i?'tab-active':'');
    if(narrow){row(' '+tabs.slice(0,3).map(tab).join(''));row(' '+tabs.slice(3).map((t,i)=>tab(t,i+3)).join(''))}
    else row(' '+tabs.map(tab).join(''));
    edge('├','┤');
    if(view===1&&!post){
      row(narrow?' '+key('ASCENT')+' · Comp · '+paint('4:2','green')+' · R7*':' '+pair(key('ASCENT')+' / Competitivo',paint('4 : 2','green')+'  R07 EN CURSO'));
      function team(start,title,color){
        section(title+' · 5',color,narrow?'HIST.':'RANGO / K/D / WR HISTÓRICOS');
        if(!start)row(paint(narrow?'  JUGADOR   AGENTE   RANGO  K/D':'  JUGADOR        AGENTE      RANGO     K/D    WR    ÚLT.5         TRK','dim'));
        players.slice(start,start+5).forEach((p,i)=>{
          const index=start+i,mark=index===selected?'›':' ',name=index===0?'Norte·tú':p[0];
          const nameWidth=narrow?10:15,agentWidth=narrow?9:12,rankWidth=narrow?7:10;
          const fields=paint(mark,'cyan')+' '+pad(name,nameWidth)+paint(pad(p[1],agentWidth),'dim')+rank(pad(p[2],rankWidth))+pad(p[3],narrow?5:7)+(narrow?'':pad(p[4],6)+form(p[5]));
          const trackerAction=narrow?'':button(' [↗] ',`tracker:${index}`,'',`Vista previa de Tracker: ${p[0]}`);
          row(button(fields+' '.repeat(inner-plain(fields).length-plain(trackerAction).length),`player:${index}`,selected===index?'selected':'')+trackerAction);
        });
      }
      team(0,'ALIADOS','green');
      section('TUS RONDAS','cyan',narrow?`${roundTotals.k}K / ${roundTotals.d}D`:`${roundTotals.k} KILLS / ${roundTotals.d} MUERTES · R7* PENDIENTE`);
      row(' '+rounds.map(r=>paint(pad(r.k+'K',4),r.k?'green':'dim')).join('')+paint('—K','amber'));
      row(' '+rounds.map((r,i)=>pad('R'+(i+1),4)).join('')+paint('R7*','amber'));
      row(' '+rounds.map(r=>paint(pad(r.d+'D',4),r.d?'red':'dim')).join('')+paint('—D','amber'));
      team(5,'ENEMIGOS','red');
      if(detail){const p=players[selected];section(p[0]+' / '+p[1]);
        if(selected===6){row(paint(' Identidad y estadísticas ocultas','amber'));row(' No se intentará descubrirlas.');}
        else{row(' '+rank(p[2])+' · K/D '+p[3]+' · WR '+p[4]);row(' HS '+p[6]+' · ADR '+p[7]+' · 20 partidas');}
        if(trackerPreview){
          row(' '+unavailableTracker());
          row(paint(selected===6?' Identidad oculta: sin enlace.':' Demo: falta Riot ID verificado.','amber'));
        }else row(button(' '+key('[g]')+' Tracker.gg',`tracker:${selected}`));
      }
    }else if(view===1){
      const match=history[historyIndex];
      section(match.win?'VICTORIA':'DERROTA',match.win?'green':'red',match.map);
      row(' '+paint(match.score,match.win?'green':'red')+' / Competitivo / '+match.agent);row();
      section('RESULTADO PROPIO');
      row(' K / D / A   '+paint(`${match.k} / ${match.d} / ${match.a}`,'cyan'));
      row(' ACS         '+match.acs);row(' Cambio RR   '+rr(match.rr));row();
      row(button(' '+key('[p]')+' Volver a la partida en curso','post'));
    }else if(view===0){
      section('NORTE','cyan','PERFIL PROPIO');
      row(' '+rank('DIAMANTE 2')+' / Nivel 142');
      row(' RR '+paint('██████','purple')+paint('░░░░','border')+' 64 / 100');row();
      section('SESIÓN DE HOY');
      row(' 3 partidas · '+paint('2 V','green')+' / '+paint('1 D','red')+' · K/D 1.13');
      row(' 59 kills / 52 muertes / 24 asist.');row();
      section('PARTIDA EN CURSO','green');
      row(' Ascent / Competitivo / Sova');row(' 10 jugadores · '+paint('1 perfil oculto','amber'));
      row(button(' '+key('[Enter]')+' Abrir partida','match'));row();
      section('FUENTES · SIMULACIÓN');
      row(' Cliente local      '+paint('● conectado','green'));
      row(' Contexto de partida  '+paint('disponible','green'));
      row(' Datos de jugadores   '+paint('9/10','amber'));
    }else if(view===2){
      section('NORTE / PERFIL PROPIO');row(' '+rank('DIAMANTE 2')+' · 64 RR · Nivel 142');
      row(paint(' Competitivo / últimas 20 partidas','dim'));row();
      row(' K/D '+key('1.18')+'   WR '+paint('55%','green')+'   HS '+key('26%'));
      row(' Victorias '+paint('███████████','green')+paint('░░░░░░░░░','border'));
      row(' 11 victorias / 9 derrotas');row();
      section('POR AGENTE');row(paint(' AGENTE     PJ    K/D    WR','dim'));
      row(' Sova       12    1.24   '+paint('58%','green'));
      row(' Omen        5    1.08   40%');row(' Killjoy     3    1.11   '+paint('67%','green'));row();
      section('CAMBIOS DE RR');row(' Ascent   '+paint('V','green')+'   '+rr(19));row(' Haven    '+paint('D','red')+'   '+rr(-16));
    }else if(view===3){
      section('HISTORIAL PROPIO');row(paint(' Hoy / Competitivo / 3 partidas','dim'));row();
      row(paint(narrow?'  MAPA     V/D    K/D/A       RR':'  MAPA       AGENTE     RESULTADO   K / D / A    RR','dim'));
      history.forEach((m,i)=>{
        const label=key(i===historyIndex?'› ':'  ')+pad(m.map,narrow?9:11)+(narrow?'':paint(pad(m.agent,10),'dim'))+paint(pad((m.win?'V ':'D ')+(narrow?'':m.score),narrow?7:12),m.win?'green':'red')+pad(`${m.k}/${m.d}/${m.a}`,narrow?12:15)+rr(m.rr);
        row(button(label,`history:${i}`,i===historyIndex?'selected':''));
      });row();row(' ↑↓ seleccionar / Enter ver resumen');row();
      section('RESUMEN');row(' '+paint('2 victorias','green')+' / '+paint('1 derrota','red')+' / RR '+rr(20));
    }else{
      section('APARIENCIA');
      row(button(' '+key('[t]')+' Tema          '+themes[theme][1],'theme'));
      row('     '+key('■ foco')+' '+paint('■ V/K','green')+' '+paint('■ D','red')+' '+paint('■ rango','purple'));row();
      section('GENERAL');
      row(button(' '+key('[i]')+' Detección     '+interval+' s','interval'));
      row(button(' '+key('[l]')+' Log cambios   '+(logs?'[x]':'[ ]'),'logs'));row();
      section('IMÁGENES / PROPUESTA');
      row(' Retrato opcional en perfil/detalle');row(' Si no hay soporte: nombre + agente');
      row(paint(' Compatibilidad aún no probada aquí.','amber'));row();
      section('PRIVACIDAD');row(' Identidad oculta     '+paint('respetar','green'));row(' Datos ausentes       '+paint('—','amber'));
      row(paint(' Ajustes locales de la maqueta.','dim'));
    }
    edge('├','┤');
    let help=view===1&&!post?key('↑↓')+' jugador '+key('Enter')+' detalle':view===3?key('↑↓')+' partida '+key('Enter')+' abrir':key('1–5')+' vistas '+key('Tab')+' foco';
    const trackerShortcut=view===1&&!post?button(key('[g]')+' Tracker',`tracker:${selected}`)+' ':'';
    if(narrow){row(' '+help);row(' '+trackerShortcut+button(key('[t]')+' tema','theme')+' '+(view===1?button(key('[p]')+' fase','post'):key('Esc')+' volver'));}
    else row(' '+help+'  '+trackerShortcut+button(key('[t]')+' '+themes[theme][1],'theme')+'  '+(view===1?button(key('[p]')+' fase','post'):key('Esc')+' volver'));
    lines.push(paint('╰'+'─'.repeat(inner)+'╯','border'));
    return `<pre class="term-screen term-${narrow?'small':'large'}" aria-label="Vista ${tabs[view]}, ${width} columnas">${lines.join('\n')}</pre>`;
  }
  function visibleButton(action){return [...content.querySelectorAll('[data-action]')].find(b=>b.dataset.action===action&&b.getClientRects().length)}
  function render(focusAction){
    root.dataset.theme=themes[theme][0];
    content.innerHTML=screen(72)+screen(38);
    content.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));
    if(focusAction)(visibleButton(focusAction)||visibleButton('tab:'+view))?.focus();
  }
  function act(action){
    if(action.startsWith('tab:')){view=Number(action.split(':')[1]);detail=false;trackerPreview=false}
    else if(action.startsWith('player:')){const next=Number(action.split(':')[1]);detail=next===selected?!detail:true;selected=next;trackerPreview=false}
    else if(action.startsWith('tracker:')){selected=Number(action.split(':')[1]);detail=true;trackerPreview=true}
    else if(action==='post'){post=!post;if(post)historyIndex=0}
    else if(action==='match'){view=1;post=false}
    else if(action.startsWith('history:')){historyIndex=Number(action.split(':')[1]);view=1;post=true}
    else if(action==='interval')interval=interval===3?5:interval===5?10:3;
    else if(action==='logs')logs=!logs;
    else if(action==='theme')theme=(theme+1)%themes.length;
    render(action);
  }
  root.addEventListener('keydown',event=>{
    if(event.altKey||event.ctrlKey||event.metaKey)return;
    const k=event.key;
    if(/^[1-5]$/.test(k))act('tab:'+(Number(k)-1));
    else if((k==='ArrowDown'||k==='ArrowUp')&&view===1&&!post){selected=(selected+(k==='ArrowDown'?1:9))%10;trackerPreview=false;render('player:'+selected)}
    else if((k==='ArrowDown'||k==='ArrowUp')&&view===3){historyIndex=(historyIndex+(k==='ArrowDown'?1:2))%3;render('history:'+historyIndex)}
    else if(k==='Escape'){detail=false;trackerPreview=false;view=1;post=false;render('tab:1')}
    else if(k==='g'&&view===1&&!post)act('tracker:'+selected);
    else if(k==='t')act('theme');
    else if(k==='p'&&view===1)act('post');
    else if(k==='i'&&view===4)act('interval');
    else if(k==='l'&&view===4)act('logs');
    // Enter/Espacio y Tab usan el foco nativo de los controles textuales.
    else return;
    event.preventDefault();
  });
  render();
})();
</script>
</div>
