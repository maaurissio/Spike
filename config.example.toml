# VTracker — Ejemplo de configuración local
# Ubicación real: %APPDATA%\vtracker\config.toml (Windows) o $XDG_CONFIG_HOME/vtracker/config.toml
# Copia este archivo a esa ruta si quieres personalizar. Nunca pongas secretos aquí.

# Tema visual: "system", "dark", "light" o "mono".
theme = "dark"

# Intervalo de comprobación entre 1 y 60 segundos.
interval_seconds = 3

# Guarda cada cambio de estado en %APPDATA%\vtracker\watch.log.
log_transitions = false
